<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Palco do Reel — Pink Opala</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    /* Palco 540×960 CSS px renderizado com deviceScaleFactor 2 → 1080×1920 (9:16).
       O site roda de verdade num iframe 360×640 — largura de celular, então o
       layout é o mobile real, não uma simulação. */
    :root { --pink: #ff00aa; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 540px; height: 960px; overflow: hidden; background: #000; }
    body {
        font-family: 'Space Grotesk', sans-serif; color: #fff;
        background:
            radial-gradient(120% 60% at 50% 100%, rgba(255, 0, 170, 0.22), transparent 60%),
            radial-gradient(90% 40% at 50% 0%, rgba(255, 0, 170, 0.10), transparent 70%),
            #000;
    }

    /* Legenda: fica no topo, fora da área que o Instagram cobre com nome/legenda do post */
    #legenda {
        position: absolute; left: 36px; right: 36px; top: 50px; height: 172px;
        display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
    }
    #legenda > * { transition: opacity .45s ease, transform .55s cubic-bezier(.16, 1, .3, 1); }
    #legenda.saindo > * { opacity: 0; transform: translateY(-10px); }
    #legenda.entrando > * { opacity: 0; transform: translateY(14px); }
    #legenda .kicker {
        font: 700 12px/1 'Space Grotesk', monospace; letter-spacing: .22em; color: var(--pink);
        text-transform: uppercase;
    }
    #legenda .titulo {
        font: 32px/1 'Archivo Black', sans-serif; text-transform: uppercase; letter-spacing: -.01em;
        transition-delay: .06s;
    }
    #legenda .corpo {
        font: 400 16px/1.35 'Space Grotesk', sans-serif; color: #c9c9d1; max-width: 460px;
        transition-delay: .12s;
    }
    #legenda .corpo b { color: #fff; font-weight: 700; }

    /* Celular */
    #celular {
        position: absolute; left: 82px; top: 236px; width: 376px; height: 656px;
        border-radius: 38px; padding: 8px; background: #111;
        box-shadow: 0 0 0 1.5px #2a2a2a, 0 0 60px rgba(255, 0, 170, .28), 0 30px 80px rgba(0, 0, 0, .8);
    }
    #celular iframe {
        display: block; width: 360px; height: 640px; border: 0; border-radius: 30px; background: #000;
    }

    /* Indicador de toque (o "dedo") */
    #dedo {
        position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px;
        border-radius: 50%; border: 2px solid rgba(255, 255, 255, .9);
        background: rgba(255, 255, 255, .22); pointer-events: none; z-index: 50;
        opacity: 0; transition: opacity .25s ease, transform .15s ease;
        box-shadow: 0 0 18px rgba(255, 0, 170, .55);
    }
    #dedo.on { opacity: 1; }
    #dedo.press { transform: scale(.72); background: rgba(255, 0, 170, .55); }

    #rodape {
        position: absolute; left: 0; right: 0; top: 906px; text-align: center;
        font: 700 10px/1 'Space Grotesk', monospace; letter-spacing: .3em; color: rgba(255, 255, 255, .45);
    }

    /* Encerramento */
    #final {
        position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center; padding: 0 44px; gap: 18px;
        background: rgba(0, 0, 0, .78); backdrop-filter: blur(10px);
        pointer-events: none; opacity: 0; transition: opacity .8s ease;
    }
    #final.on { opacity: 1; }
    #final > * { transform: translateY(16px); opacity: 0; transition: all .7s cubic-bezier(.16, 1, .3, 1); }
    #final.on > * { transform: none; opacity: 1; }
    #final.on > :nth-child(2) { transition-delay: .15s; }
    #final.on > :nth-child(3) { transition-delay: .3s; }
    #final.on > :nth-child(4) { transition-delay: .45s; }
    #final.on > :nth-child(5) { transition-delay: .6s; }
    #final .kicker { font: 700 11px/1 'Space Grotesk'; letter-spacing: .25em; color: var(--pink); }
    #final .titulo { font: 44px/.95 'Archivo Black'; text-transform: uppercase; }
    #final .corpo { font: 400 16px/1.4 'Space Grotesk'; color: #c9c9d1; }
    #final .cta {
        margin-top: 8px; padding: 14px 26px; border-radius: 999px; background: var(--pink);
        font: 15px/1 'Archivo Black'; text-transform: uppercase; letter-spacing: .02em;
        box-shadow: 0 0 40px rgba(255, 0, 170, .6);
    }
    #final .url { font: 700 12px/1 'Space Grotesk'; letter-spacing: .25em; color: rgba(255, 255, 255, .6); }
</style>
</head>
<body>
    <div id="legenda"></div>
    <div id="celular"><iframe id="site" title="Site Pink Opala"></iframe></div>
    <div id="dedo"></div>
    <div id="rodape">PINKOPALA.COM</div>
    <div id="final"></div>

<script>
// API controlada pelo script de gravação (gravar-reel.cjs)
const legenda = document.getElementById('legenda');
const dedo = document.getElementById('dedo');
const esc = (s) => String(s ?? '');

window.palco = {
    // Troca a legenda com saída/entrada animadas; aceita <b> no corpo
    async legenda({ kicker, titulo, corpo }) {
        if (legenda.children.length) {
            legenda.classList.add('saindo');
            await new Promise(r => setTimeout(r, 380));
        }
        legenda.classList.remove('saindo');
        legenda.classList.add('entrando');
        legenda.innerHTML =
            (kicker ? `<div class="kicker">${esc(kicker)}</div>` : '') +
            `<div class="titulo">${esc(titulo)}</div>` +
            (corpo ? `<div class="corpo">${esc(corpo)}</div>` : '');
        legenda.offsetHeight; // força reflow para a transição de entrada
        legenda.classList.remove('entrando');
    },
    dedo(x, y, { visivel = true, press = false } = {}) {
        dedo.style.left = x + 'px';
        dedo.style.top = y + 'px';
        dedo.classList.toggle('on', visivel);
        dedo.classList.toggle('press', press);
    },
    final({ kicker, titulo, corpo, cta, url }) {
        const f = document.getElementById('final');
        f.innerHTML =
            `<div class="kicker">${esc(kicker)}</div><div class="titulo">${esc(titulo)}</div>` +
            `<div class="corpo">${esc(corpo)}</div><div class="cta">${esc(cta)}</div><div class="url">${esc(url)}</div>`;
        f.offsetHeight;
        f.classList.add('on');
    },
    carregarSite(src) { document.getElementById('site').src = src; },
};
</script>
</body>
</html>
